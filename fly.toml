# Fly.io deployment (use scripts/deploy-fly.sh; the app name is passed with -a).
app = "unijourney"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DEMO_CLOCK = "2026-09-27T09:00:00+03:00"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "unijourney_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
