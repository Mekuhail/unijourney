# Local always-on deployment: docker compose up -d   (restarts automatically with Docker Desktop)
services:
  unijourney:
    build: .
    image: unijourney:latest
    container_name: unijourney
    ports:
      - "8080:8080"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set a random SESSION_SECRET of at least 32 characters}
      # Optional: GOOGLE_MAPS_API_KEY, ANTHROPIC_API_KEY
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - unijourney-data:/data
    restart: unless-stopped
volumes:
  unijourney-data:
